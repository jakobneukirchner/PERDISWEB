<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PERDISWEB – Dienstplan</title>
<style>
:root{
  --teal:#008B8B; --teal2:#20B2AA;
  --bg:#f4f4f4; --card:#fff;
  --text:#1a1a1a; --muted:#666;
  --border:#ddd; --green:#4CAF50; --orange:#ff9800; --red:#f44336;
}
[data-theme=dark]{
  --bg:#1a1a1a; --card:#2a2a2a;
  --text:#f0f0f0; --muted:#aaa; --border:#444;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;transition:.3s}

/* HEADER */
.hdr{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:99;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.hdr h1{font-size:20px;letter-spacing:.5px}
.hdr-sub{font-size:12px;opacity:.85;margin-top:2px}
.hdr-right{display:flex;gap:8px;align-items:center}
.icon-btn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:14px}

/* NAV */
.nav{display:flex;background:var(--card);padding:8px;gap:6px;border-bottom:1px solid var(--border)}
.nav-btn{flex:1;padding:10px;border:none;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;font-weight:600;font-size:13px;transition:.2s}
.nav-btn.active{background:var(--teal);color:#fff}
.nav-btn:hover:not(.active){background:var(--border)}

/* MAIN */
.main{flex:1;padding:16px;max-width:720px;width:100%;margin:0 auto}

/* VIEWS */
.view{display:none}
.view.active{display:block;animation:fadein .25s}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* LOGIN */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:70vh}
.login-box{background:var(--card);border-radius:12px;padding:32px;width:100%;max-width:380px;box-shadow:0 4px 20px rgba(0,0,0,.1)}
.login-box h2{color:var(--teal);margin-bottom:6px;font-size:22px}
.login-box p{color:var(--muted);font-size:13px;margin-bottom:24px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;margin-top:14px}
input[type=text],input[type=password]{
  width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:8px;
  font-size:14px;background:var(--bg);color:var(--text);transition:.2s
}
input:focus{outline:none;border-color:var(--teal)}
.btn{display:block;width:100%;padding:13px;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;transition:.2s;margin-top:20px}
.btn-primary{background:var(--teal);color:#fff}
.btn-primary:hover{background:var(--teal2)}
.btn-primary:disabled{opacity:.5;cursor:default}

/* MESSAGES */
.msg{padding:11px 14px;border-radius:8px;font-size:13px;margin-top:14px;display:none}
.msg.show{display:block}
.msg.err{background:rgba(244,67,54,.1);color:var(--red);border-left:4px solid var(--red)}
.msg.ok{background:rgba(76,175,80,.1);color:var(--green);border-left:4px solid var(--green)}

/* LOADING */
.loading{text-align:center;padding:48px 20px;color:var(--muted)}
.spin{display:inline-block;width:36px;height:36px;border:4px solid var(--border);border-top-color:var(--teal);border-radius:50%;animation:spin .9s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* TODAY CARD */
.day-card{background:var(--card);border-radius:10px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.07);border-left:4px solid var(--teal)}
.day-card-title{background:var(--teal);color:#fff;padding:10px 14px;border-radius:7px;font-weight:700;font-size:14px;margin-bottom:14px}

/* PERLSCHNUR */
.perlschnur{display:flex;flex-direction:column;gap:10px}
.fahrt{
  background:var(--bg);border:1.5px solid var(--border);border-radius:8px;
  padding:12px 14px;display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:10px;
  transition:.2s;
}
.fahrt:hover{border-color:var(--teal);box-shadow:0 2px 8px rgba(0,139,139,.12)}
.fahrt-num{font-weight:800;color:var(--teal);font-size:18px;text-align:center}
.fahrt-times{display:flex;flex-direction:column;gap:3px}
.t-start{color:var(--green);font-weight:700;font-size:13px}
.t-end{color:var(--orange);font-size:13px}
.fahrt-ort{font-size:11px;color:var(--muted);text-align:right;line-height:1.4}

/* SEPARATOR – pause/leer */
.fahrt-pause{
  background:transparent;border:1.5px dashed var(--border);border-radius:8px;
  padding:8px 14px;font-size:12px;color:var(--muted);text-align:center;
}

/* ACTION BUTTONS */
.actions{display:flex;gap:8px;margin-top:14px}
.btn-sm{flex:1;padding:10px;border:none;border-radius:7px;font-weight:600;font-size:13px;cursor:pointer;transition:.2s}
.btn-teal{background:var(--teal);color:#fff}
.btn-teal:hover{background:var(--teal2)}
.btn-gray{background:var(--border);color:var(--text)}
.btn-gray:hover{filter:brightness(.9)}

/* ROSTER LIST */
.roster-list{display:flex;flex-direction:column;gap:8px}
.roster-item{
  background:var(--card);border-radius:8px;padding:14px 16px;
  border:2px solid transparent;cursor:pointer;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.05);
}
.roster-item:hover{border-color:var(--teal);transform:translateY(-1px)}
.roster-item-date{font-size:11px;color:var(--muted);margin-bottom:3px}
.roster-item-svc{font-weight:700;font-size:15px}
.roster-item-time{font-size:12px;color:var(--muted);margin-top:3px}
.badge{display:inline-block;background:var(--teal);color:#fff;border-radius:20px;padding:2px 9px;font-size:11px;margin-right:4px;font-weight:600}
.badge-free{background:var(--border);color:var(--muted)}

/* CALENDAR */
.cal-wrap{background:var(--card);border-radius:10px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.07);margin-bottom:16px}
.cal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.cal-hdr h3{font-size:16px}
.cal-nav{background:var(--teal);color:#fff;border:none;padding:7px 12px;border-radius:6px;cursor:pointer;font-size:14px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-wday{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:4px}
.cal-day{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--border);border-radius:7px;font-size:12px;font-weight:600;
  cursor:pointer;transition:.2s;position:relative;
}
.cal-day:hover:not(.cal-other){border-color:var(--teal);background:rgba(0,139,139,.07)}
.cal-day.cal-today{border-color:var(--orange)}
.cal-day.cal-selected{background:var(--teal);color:#fff;border-color:var(--teal)}
.cal-day.cal-has-shift::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--green)}
.cal-day.cal-selected.cal-has-shift::after{background:#fff}
.cal-day.cal-other{color:var(--border);cursor:default}
.cal-detail{margin-top:8px}

/* FOOTER */
.footer{text-align:center;padding:14px;font-size:11px;color:var(--muted);border-top:1px solid var(--border);background:var(--card)}

@media(max-width:500px){
  .hdr h1{font-size:17px}
  .fahrt{grid-template-columns:44px 1fr auto;gap:7px}
  .fahrt-num{font-size:15px}
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr" id="hdr">
  <div>
    <h1>PERDISWEB</h1>
    <div class="hdr-sub" id="hdrSub">Verkehrs-AG</div>
  </div>
  <div class="hdr-right">
    <button class="icon-btn" onclick="toggleTheme()" title="Darkmode">🌙</button>
    <button class="icon-btn" id="logoutBtn" onclick="logout()" style="display:none">Abmelden</button>
  </div>
</div>

<!-- LOGIN -->
<div class="main" id="loginSection">
  <div class="login-wrap">
    <div class="login-box">
      <h2>PERDIS</h2>
      <p>Verkehrs-AG Dienstplan</p>
      <label for="uname">Benutzername</label>
      <input type="text" id="uname" autocomplete="username" placeholder="z.B. muster">
      <label for="upass">Passwort</label>
      <input type="password" id="upass" autocomplete="current-password" placeholder="••••••">
      <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">Anmelden</button>
      <div class="msg" id="loginMsg"></div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="appSection" style="display:none;flex:1;display:none;flex-direction:column">
  <div class="nav">
    <button class="nav-btn active" data-view="today" onclick="switchView('today',this)">Mein Tag</button>
    <button class="nav-btn" data-view="roster" onclick="switchView('roster',this)">Dienstplan</button>
    <button class="nav-btn" data-view="calendar" onclick="switchView('calendar',this)">Tageswahl</button>
  </div>

  <div class="main">
    <!-- TODAY -->
    <div id="todayView" class="view active">
      <div id="todayContent" class="loading"><div class="spin"></div><div>Laden…</div></div>
    </div>

    <!-- ROSTER -->
    <div id="rosterView" class="view">
      <div id="rosterContent" class="loading"><div class="spin"></div><div>Laden…</div></div>
    </div>

    <!-- CALENDAR -->
    <div id="calendarView" class="view">
      <div class="cal-wrap">
        <div class="cal-hdr">
          <button class="cal-nav" onclick="calPrev()">&#8592;</button>
          <h3 id="calTitle"></h3>
          <button class="cal-nav" onclick="calNext()">&#8594;</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
      <div id="calDetail" class="cal-detail"></div>
    </div>
  </div>
</div>

<div class="footer">PERDISWEB v2.0 – Verkehrs-AG</div>

<script>
// ═══════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════
const S = {
  username: '',
  session: '',
  roster: {},          // { 'YYYY-MM-DD': [{dienst, start, end, anfangsort}] }
  shiftCache: {},      // { 'YYYY-MM-DD': [{dienst,start,end,vonOrt,bisOrt,linie,richtung}] }
  calMonth: new Date(),
  calSelected: null
};

// ═══════════════════════════════════════════════════════════════════
// STORAGE (base64 obfuscation)
// ═══════════════════════════════════════════════════════════════════
function store(k,v){try{localStorage.setItem(k,btoa(unescape(encodeURIComponent(JSON.stringify(v)))))}catch{}}
function load(k){try{const v=localStorage.getItem(k);return v?JSON.parse(decodeURIComponent(escape(atob(v)))):null}catch{return null}}
function clearStore(){localStorage.removeItem('ps_sess');localStorage.removeItem('ps_roster');localStorage.removeItem('ps_scache')}

// ═══════════════════════════════════════════════════════════════════
// API
// ═══════════════════════════════════════════════════════════════════
async function api(body) {
  const r = await fetch('/.netlify/functions/perdis-login', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  return r.json();
}

// ═══════════════════════════════════════════════════════════════════
// LOGIN
// ═══════════════════════════════════════════════════════════════════
async function doLogin() {
  const un = document.getElementById('uname').value.trim();
  const pw = document.getElementById('upass').value.trim();
  const msg = document.getElementById('loginMsg');
  const btn = document.getElementById('loginBtn');

  if (!un || !pw) { showMsg(msg, 'err', 'Bitte Benutzername und Passwort eingeben'); return; }

  btn.disabled = true;
  btn.textContent = 'Anmelden…';
  showMsg(msg, '', '');

  const res = await api({ action:'login', username: un, password: pw }).catch(e => ({success:false,error:e.message}));

  btn.disabled = false;
  btn.textContent = 'Anmelden';

  if (!res.success) {
    showMsg(msg, 'err', res.error || 'Anmeldung fehlgeschlagen');
    return;
  }

  S.username = un;
  S.session  = res.session;
  S.roster   = res.roster || {};
  S.shiftCache = {};

  store('ps_sess',   { username: un, session: S.session });
  store('ps_roster', S.roster);

  showMsg(msg, 'ok', 'Erfolgreich angemeldet!');
  showApp();
}

function showApp() {
  document.getElementById('loginSection').style.display = 'none';
  const app = document.getElementById('appSection');
  app.style.display = 'flex';
  app.style.flexDirection = 'column';
  document.getElementById('logoutBtn').style.display = '';
  document.getElementById('hdrSub').textContent = 'Angemeldet als: ' + S.username;
  renderToday();
  S.calMonth = new Date();
  renderCalendar();
}

function logout() {
  if (!confirm('Wirklich abmelden?')) return;
  clearStore();
  Object.assign(S, { username:'', session:'', roster:{}, shiftCache:{} });
  document.getElementById('appSection').style.display = 'none';
  document.getElementById('loginSection').style.display = '';
  document.getElementById('logoutBtn').style.display = 'none';
  document.getElementById('hdrSub').textContent = 'Verkehrs-AG';
  document.getElementById('upass').value = '';
  document.getElementById('loginMsg').className = 'msg';
  switchView('today', document.querySelector('.nav-btn'));
}

// ═══════════════════════════════════════════════════════════════════
// TODAY VIEW
// ═══════════════════════════════════════════════════════════════════
function renderToday() {
  const today = todayStr();
  const entries = S.roster[today] || [];
  const el = document.getElementById('todayContent');

  if (entries.length === 0) {
    el.innerHTML = `<div style="text-align:center;padding:48px 0;color:var(--muted)">Heute kein Dienst geplant</div>`;
    return;
  }

  el.innerHTML = buildDayCard(today, entries);
}

// ═══════════════════════════════════════════════════════════════════
// ROSTER VIEW
// ═══════════════════════════════════════════════════════════════════
function renderRoster() {
  const el = document.getElementById('rosterContent');
  const dates = Object.keys(S.roster).sort();

  if (dates.length === 0) {
    el.innerHTML = `<div style="text-align:center;padding:48px 0;color:var(--muted)">Kein Dienstplan geladen</div>`;
    return;
  }

  const html = dates.map(d => {
    const entries = S.roster[d];
    const svcs = entries.map(e => `<span class="badge">${e.dienst}</span>`).join('');
    const time = entries[0]?.start && entries[0]?.end ? `${entries[0].start} – ${entries[entries.length-1].end}` : '';
    return `<div class="roster-item" onclick="selectDate('${d}')">
      <div class="roster-item-date">${fmtDate(d)}</div>
      <div class="roster-item-svc">${svcs}</div>
      ${time ? `<div class="roster-item-time">${time}</div>` : ''}
    </div>`;
  }).join('');

  el.innerHTML = `<div class="roster-list">${html}</div>`;
}

// ═══════════════════════════════════════════════════════════════════
// CALENDAR VIEW
// ═══════════════════════════════════════════════════════════════════
function renderCalendar() {
  const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  const DAYS   = ['Mo','Di','Mi','Do','Fr','Sa','So'];
  const y = S.calMonth.getFullYear();
  const m = S.calMonth.getMonth();

  document.getElementById('calTitle').textContent = `${MONTHS[m]} ${y}`;

  const grid = document.getElementById('calGrid');
  grid.innerHTML = DAYS.map(d => `<div class="cal-wday">${d}</div>`).join('');

  const today = todayStr();
  const first = new Date(y, m, 1);
  // Monday-first offset
  let startOff = first.getDay() - 1; if (startOff < 0) startOff = 6;

  for (let i = 0; i < 42; i++) {
    const date = new Date(y, m, 1 - startOff + i);
    const ds = fmtISO(date);
    const inMonth = date.getMonth() === m;

    const cls = [
      'cal-day',
      !inMonth         ? 'cal-other'    : '',
      ds === today     ? 'cal-today'    : '',
      ds === S.calSelected ? 'cal-selected' : '',
      S.roster[ds]     ? 'cal-has-shift': ''
    ].filter(Boolean).join(' ');

    const dayEl = document.createElement('div');
    dayEl.className = cls;
    dayEl.textContent = date.getDate();
    if (inMonth) dayEl.onclick = () => selectDate(ds);
    grid.appendChild(dayEl);
  }
}

async function selectDate(ds) {
  // If in roster view: jump to calendar
  switchView('calendar', document.querySelector('[data-view=calendar]'));

  S.calSelected = ds;
  S.calMonth = new Date(ds + 'T12:00:00');
  renderCalendar();

  const detail = document.getElementById('calDetail');

  // Use roster data as base
  const base = S.roster[ds] || [];

  if (base.length === 0) {
    detail.innerHTML = `<div class="day-card"><div class="day-card-title">${fmtDate(ds)}</div><p style="color:var(--muted);text-align:center;padding:20px 0">Kein Dienst</p></div>`;
    return;
  }

  // Try to load detailed shift data
  if (!S.shiftCache[ds]) {
    detail.innerHTML = `<div class="loading"><div class="spin"></div><div>Lade Tagesplan…</div></div>`;
    const res = await api({ action:'shift', session: S.session, date: ds }).catch(() => null);
    if (res && res.success && res.rows && res.rows.length > 0) {
      S.shiftCache[ds] = res.rows;
      store('ps_scache', S.shiftCache);
    } else {
      S.shiftCache[ds] = null; // mark as tried
    }
  }

  const shiftRows = S.shiftCache[ds];

  if (shiftRows && shiftRows.length > 0) {
    detail.innerHTML = buildDetailedCard(ds, base, shiftRows);
  } else {
    detail.innerHTML = buildDayCard(ds, base);
  }
}

// ═══════════════════════════════════════════════════════════════════
// CARD BUILDERS
// ═══════════════════════════════════════════════════════════════════
function buildDayCard(ds, entries) {
  const fahrten = entries.map(e => `
    <div class="fahrt">
      <div class="fahrt-num">${e.dienst}</div>
      <div class="fahrt-times">
        <div class="t-start">▶ ${e.start || '–'}</div>
        <div class="t-end">■ ${e.end || '–'}</div>
      </div>
      <div class="fahrt-ort">${e.anfangsort || ''}</div>
    </div>`).join('');

  return `<div class="day-card">
    <div class="day-card-title">${fmtDate(ds)}</div>
    <div class="perlschnur">${fahrten}</div>
    ${actionBtns(ds)}
  </div>`;
}

function buildDetailedCard(ds, rosterEntries, rows) {
  // Group rows by Dienst, show as perlschnur
  // First and last row give Gesamtzeit
  const first = rows[0];
  const last  = rows[rows.length - 1];
  const svcNr = rosterEntries[0]?.dienst || first.dienst;

  const fahrten = rows.map((r, i) => {
    // Pause rows look like: richtung contains Pause / Wegezeit etc – already filtered in backend
    return `<div class="fahrt">
      <div class="fahrt-num" style="font-size:14px">${r.linie || r.dienst}</div>
      <div class="fahrt-times">
        <div class="t-start">▶ ${r.start} – ${r.vonOrt}</div>
        <div class="t-end">■ ${r.end} – ${r.bisOrt}</div>
      </div>
      <div class="fahrt-ort" style="font-size:10px">${r.richtung || ''}</div>
    </div>`;
  }).join('');

  return `<div class="day-card">
    <div class="day-card-title">Dienst ${svcNr} · ${fmtDate(ds)} · ${first.start}–${last.end}</div>
    <div class="perlschnur">${fahrten}</div>
    ${actionBtns(ds)}
  </div>`;
}

function actionBtns(ds) {
  return `<div class="actions">
    <button class="btn-sm btn-teal" onclick="openPDF('${ds}')">📄 PDF öffnen</button>
    <button class="btn-sm btn-gray" onclick="sharePDF('${ds}')">⬆ Teilen</button>
  </div>`;
}

// ═══════════════════════════════════════════════════════════════════
// PDF
// ═══════════════════════════════════════════════════════════════════
function openPDF(ds) {
  window.open(`https://perdisweb.verkehrs-ag.de/WebComm/shiprint.aspx?${ds}`, '_blank');
}
function sharePDF(ds) {
  const url = `https://perdisweb.verkehrs-ag.de/WebComm/shiprint.aspx?${ds}`;
  if (navigator.share) navigator.share({ title:'Dienstplan', text:fmtDate(ds), url }).catch(()=>{});
  else openPDF(ds);
}

// ═══════════════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════════════
function switchView(name, btn) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(name + 'View').classList.add('active');
  if (btn) btn.classList.add('active');
  if (name === 'roster') renderRoster();
  if (name === 'calendar') renderCalendar();
}

function calPrev() { S.calMonth.setMonth(S.calMonth.getMonth()-1); renderCalendar(); }
function calNext() { S.calMonth.setMonth(S.calMonth.getMonth()+1); renderCalendar(); }

// ═══════════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════════
function todayStr() { return fmtISO(new Date()); }
function fmtISO(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function fmtDate(ds) {
  const d = new Date(ds + 'T12:00:00');
  const DN = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
  return `${DN[d.getDay()]}, ${d.getDate()}.${d.getMonth()+1}.${d.getFullYear()}`;
}
function showMsg(el, type, text) {
  el.className = 'msg' + (type ? ' ' + type + ' show' : '');
  el.textContent = text;
}
function toggleTheme() {
  const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('ps_theme', t);
}

// ═══════════════════════════════════════════════════════════════════
// KEYBOARD
// ═══════════════════════════════════════════════════════════════════
document.getElementById('upass').addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });
document.getElementById('uname').addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('upass').focus(); });

// ═══════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════
window.addEventListener('load', () => {
  const t = localStorage.getItem('ps_theme') || 'light';
  document.documentElement.setAttribute('data-theme', t);

  const sess = load('ps_sess');
  if (sess) {
    const roster = load('ps_roster');
    if (sess.username && sess.session && roster) {
      S.username = sess.username;
      S.session  = sess.session;
      S.roster   = roster;
      S.shiftCache = load('ps_scache') || {};
      showApp();
      return;
    }
  }

  // Pre-fill username if saved
  if (sess && sess.username) document.getElementById('uname').value = sess.username;
});
</script>
</body>
</html>
